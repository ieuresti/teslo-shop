<div
    class="bg-slate-800 overflow-y-scroll w-screen min-h-screen antialiased text-slate-300 selection:bg-blue-600 selection:text-white">
    <!-- Overlay para cerrar sidebar en móvil -->
    @if (isSidebarOpen()) {
    <!-- fixed inset-0: Lo posiciona de forma fija cubriendo toda la pantalla -->
    <!-- bg-black/50: Aplica un fondo negro semi-transparente (50% de opacidad), oscureciendo el contenido detrás para enfocarse en la sidebar -->
    <!-- z-20: Establece un z-index alto (20) para que esté encima del contenido principal, pero debajo del botón hamburger (que tiene z-30) -->
    <div class="fixed inset-0 bg-black/50 z-20 md:hidden" (click)="closeSidebar()"></div>
    }

    <div class="flex flex-col relative w-screen">
        <!-- Hamburger Menu (solo en móvil) -->
        <button
            class="md:hidden fixed top-4 right-4 z-30 p-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition"
            (click)="toggleSidebar()">
            @if (!isSidebarOpen()) {
            <!-- Icono de hamburguesa -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
            }
            @else {
            <!-- Icono de cerrar -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            }
        </button>
        <!-- Sidebar Menu -->
        <div id="menu"
            class="bg-gray-900 min-h-screen z-20 text-slate-300 w-64 fixed left-0 h-screen overflow-y-scroll transition-transform duration-300 ease-in-out md:translate-x-0 md:z-10"
            [class.translate-x-0]="isSidebarOpen()" [class.-translate-x-full]="!isSidebarOpen()">

            <div id="logo" class="my-4 px-6">
                <h1 class="text-lg md:text-2xl font-bold text-white font-montserrat cursor-pointer" routerLink="/">
                    Teslo<span class="text-blue-500"> | Shop</span>
                </h1>
                <p class="text-slate-500 text-sm">Manage your actions and activities</p>
            </div>

            <div id="profile" class="px-6 py-10">
                <p class="text-slate-500 pb-2">Bienvenido,</p>
                <a href="#" class="inline-flex space-x-2 items-center">
                    <span>
                        <img class="rounded-full w-8 h-8"
                            src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=128&q=80"
                            alt="">
                    </span>
                    <span class="text-sm md:text-base font-bold">
                        {{ user()?.fullName }}
                    </span>
                </a>
            </div>

            <div id="nav" class="w-full px-6">
                <a routerLink="/admin/products" (click)="closeSidebar()"
                    class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 text-white flex-shrink-0">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                        </svg>

                    </div>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold leading-5 text-white">Dashboard</span>
                        <span class="text-sm text-white/50 hidden md:block">Data Overview</span>
                    </div>
                </a>
                <a routerLink="/admin/products" routerLinkActive="bg-blue-800" (click)="closeSidebar()"
                    class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-6 flex-shrink-0">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-lg text-slate-300 font-bold leading-5">Productos</span>
                        <span class="text-sm text-slate-500 hidden md:block">Listado de productos</span>
                    </div>
                </a>

                <div class="divider my-2"></div>
                <button class="btn btn-ghost text-accent w-full" (click)="authService.logout(); closeSidebar()">
                    Cerrar sesión
                </button>
            </div>

        </div>
    </div>


    <!-- Main Content -->
    <div class="flex-1 md:ml-64 pt-5 px-5">
        <router-outlet></router-outlet>

        <div class="pt-10">
            <app-footer></app-footer>
        </div>
    </div>
</div>
