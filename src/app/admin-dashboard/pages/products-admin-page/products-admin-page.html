<h1 class="text-2xl font-bold">Listado de productos</h1>

<h3 class="text-lg">Total de productos
    <span class="text-accent">{{ productsResource.value()?.count }}</span>
</h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
    <app-paginator 
        [pages]="productsResource.value()?.pages ?? 0" 
        [currentPage]="paginatorService.currentPage()">
    </app-paginator>

    <select class="select select-bordered w-32"
        (change)="productsPerPages.set(+selectPerPage.value)"
        #selectPerPage>
        <!-- El operador + antes del value convierte el string en un número -->
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
    </select>

    <div class="flex-1">
        <label class="input">
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </g>
            </svg>
            <input type="search" placeholder="Buscar..." 
                (input)="buscar(searchInput.value)"
                (keydown.enter)="buscar(searchInput.value)" 
                #searchInput/>
        </label>
    </div>

    <div class="flex justify-end">
        <button class="btn btn-primary" routerLink="/admin/product/new">
            Nuevo producto
        </button>
    </div>
</div>

<app-product-table [products]="productosFiltrados()"></app-product-table>
