<div class="card bg-base-100 shadow-sm animate-fadeIn">
    <figure>
        <img [src]="product().images | productImage" [alt]="product().title" />
    </figure>
    <div class="card-body">
        <h2 class="card-title font-montserrat text-lg">
            <a class="cursor-pointer hover:underline" [routerLink]="['/product', product().slug]">{{ product().title }}</a>
            <div class="badge badge-secondary">{{ product().price | currency }}</div>
        </h2>
        <p>{{ product().description | slice: 0:70 }}...</p>
        <div class="card-actions justify-end pb-3">
            @for (size of product().sizes; track size) {
            <div class="badge badge-outline">{{ size }}</div>
            }
        </div>
        <div class="card-actions justify-end">
            <a class="btn btn-primary" [routerLink]="['/product', product().slug]">Ver más</a>
        </div>
    </div>
</div>
